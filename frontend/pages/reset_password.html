<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>

<body data-page="reset-password">
  <div id="code-particles"></div>

  <nav class="navbar fixed-top navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../assets/SkillUpDevLogoSemNome.png" height="35" class="me-2" alt="Logo SkillUp Dev">
        <span>SkillUp Dev</span>
      </a>
    </div>
  </nav>

  <section class="auth-section d-flex align-items-center justify-content-center">
    <div class="auth-container">
      <div class="auth-card text-center">
        <img src="../assets/SkillUpDevLogoSemNome.png" height="60" class="mb-3" alt="Logo SkillUp Dev">

        <h2>Definir nova senha</h2>
        <p class="auth-subtitle">
          Escolha uma nova senha para voltar a acessar a plataforma.
        </p>

        <p id="resetPasswordStatus" class="password-reset-status">
          Validando link de recuperação...
        </p>

        <div id="resetPasswordFeedback" class="alert d-none" role="alert"></div>

        <form id="resetPasswordForm">
          <div class="mb-3 text-start">
            <label for="novaSenha">Nova senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="novaSenha"
                class="form-control input-with-icon-right"
                placeholder="Digite a nova senha"
                minlength="6"
                required
              >

              <img
                src="../assets/icons/eye-slash.svg"
                id="toggleNovaSenhaIcon"
                class="input-icon-right"
                onclick="toggleNovaSenha()"
                alt=""
              >
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="confirmarNovaSenha">Confirmar nova senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="confirmarNovaSenha"
                class="form-control input-with-icon-right"
                placeholder="Confirme a nova senha"
                required
              >

              <img
                src="../assets/icons/eye-slash.svg"
                id="toggleConfirmarNovaSenhaIcon"
                class="input-icon-right"
                onclick="toggleConfirmarNovaSenha()"
                alt=""
              >
            </div>
          </div>

          <button id="resetPasswordBtn" class="btn btn-primary w-100 mt-3" type="submit">
            Salvar nova senha
          </button>
        </form>

        <p class="mt-3">
          <a href="forgot_password.html">Solicitar outro link</a>
        </p>

        <p>
          <a href="login.html" class="text-decoration-none">Voltar para login</a>
        </p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container text-center">
      <p>&copy; 2026 SkillUp Dev - Todos os direitos reservados</p>
    </div>
  </footer>
</body>
</html>
