<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>

<body data-page="forgot-password">
  <div id="code-particles"></div>

  <nav class="navbar fixed-top navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../assets/SkillUpDevLogoSemNome.png" height="35" class="me-2" alt="Logo SkillUp Dev">
        <span>SkillUp Dev</span>
      </a>
    </div>
  </nav>

  <section class="auth-section d-flex align-items-center justify-content-center">
    <div class="auth-container">
      <div class="auth-card text-center">
        <img src="../assets/SkillUpDevLogoSemNome.png" height="60" class="mb-3" alt="Logo SkillUp Dev">

        <h2>Recuperar senha</h2>
        <p class="auth-subtitle">
          Digite seu e-mail para gerar um link de redefinição e continuar seu acesso.
        </p>

        <div id="forgotPasswordFeedback" class="alert d-none" role="alert"></div>

        <form id="forgotPasswordForm">
          <div class="mb-3 text-start">
            <label for="forgotPasswordEmail">Email</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="forgotPasswordEmail"
                class="form-control input-with-icon-right"
                placeholder="Digite seu email"
                required
              >

              <img src="../assets/icons/envelope.svg" class="input-icon-right" alt="">
            </div>
          </div>

          <button id="forgotPasswordBtn" class="btn btn-primary w-100 mt-3" type="submit">
            Enviar link de recuperação
          </button>
        </form>

        <div id="forgotPasswordPreview" class="password-reset-preview d-none">
          <p class="mb-2">
            Ambiente local: use este link de teste para abrir a tela de redefinição.
          </p>
          <a
            id="forgotPasswordPreviewLink"
            class="btn btn-outline-primary w-100"
            href="#"
          >
            Abrir tela de redefinição
          </a>
          <small id="forgotPasswordPreviewExpiry" class="d-block mt-2"></small>
        </div>

        <p class="mt-3">
          Lembrou a senha?
          <a href="login.html">Voltar para login</a>
        </p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container text-center">
      <p>&copy; 2026 SkillUp Dev - Todos os direitos reservados</p>
    </div>
  </footer>
</body>
</html>
