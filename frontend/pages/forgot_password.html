<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Recuperar Senha - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="../js/main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<div id="code-particles"></div>

<!-- NAVBAR -->
<nav class="navbar fixed-top navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center" href="../index.html">
      <img src="../assets/SkillUpDevLogoSemNome.png" height="35" class="me-2">
      <span>SkillUp Dev</span>
    </a>

  </div>
</nav>

<!-- RECUPERAR SENHA -->
<section class="auth-section d-flex align-items-center justify-content-center">

  <div class="auth-container">
    <div class="auth-card text-center">

      <!-- LOGO -->
      <img src="../assets/SkillUpDevLogoSemNome.png" height="60" class="mb-3">

      <h2>Recuperar senha</h2>
      <p class="auth-subtitle">
        Digite seu email para receber instruções de recuperação 🔐
      </p>

      <form>

        <div class="mb-3 text-start">
          <label>Email</label>
          <input type="email"
                 class="form-control"
                 placeholder="Digite seu email"
                 required>
        </div>

        <button class="btn btn-primary w-100 mt-3">
          Enviar link de recuperação
        </button>

      </form>

      <p class="mt-3">
        Lembrou a senha?
        <a href="login.html">Voltar para login</a>
      </p>

    </div>
  </div>

</section>

<!-- FOOTER -->
<footer>
  <div class="container text-center">
    <p>© 2026 SkillUp Dev - Todos os direitos reservados</p>
  </div>
</footer>

</body>
</html>
