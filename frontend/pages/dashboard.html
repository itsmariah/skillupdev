<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body data-page="dashboard">
  <div id="code-particles"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="../index.html">SkillUp Dev</a>

      <div class="ms-auto">
        <button class="btn btn-outline-light" onclick="logout()">
          Sair
        </button>
      </div>
    </div>
  </nav>

  <section class="dashboard-section">
    <div class="container">
      <div class="dashboard-header">
        <h2>Ola, <span id="userName">Dev</span></h2>
        <p>Continue evoluindo suas soft skills.</p>
      </div>

      <button class="btn btn-primary" onclick="window.location.href='challenges.html'">
        Acessar desafios
      </button>

      <div class="dashboard-card">
        <h4 id="userLevel">Nivel 1</h4>

        <div class="progress mt-3">
          <div
            id="progressBar"
            class="progress-bar"
            style="width: 0%"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
        </div>

        <p id="xpSummary" class="mt-2">0 XP / 200 XP</p>
      </div>

      <div class="row mt-4 g-4">
        <div class="col-md-4">
          <div class="dashboard-box">
            <h5>Desafios concluidos</h5>
            <p id="challengeCount">0/0</p>
            <button class="btn btn-primary" onclick="window.location.href='challenges.html'">
              Acessar
            </button>
          </div>
        </div>

        <div class="col-md-4">
          <div class="dashboard-box">
            <h5>Desafios pendentes</h5>
            <p id="pendingCount">0</p>
            <button class="btn btn-primary" onclick="window.location.href='challenges.html'">
              Ver
            </button>
          </div>
        </div>

        <div class="col-md-4">
          <div class="dashboard-box">
            <h5>Perfil</h5>
            <p>Nickname: <span id="profileNick">-</span></p>
            <button class="btn btn-primary" onclick="window.location.href='register.html'">
              Editar depois
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
