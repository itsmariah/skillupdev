<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Dashboard - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="../js/main.js"></script>
</head>

<body>

<div id="code-particles"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">

    <a class="navbar-brand" href="../index.html">
      SkillUp Dev
    </a>

    <div class="ms-auto">
      <button class="btn btn-outline-light" onclick="logout()">
        Sair
      </button>
    </div>

  </div>
</nav>

<!-- DASHBOARD -->
<section class="dashboard-section">

  <div class="container">

    <!-- HEADER -->
    <div class="dashboard-header">

      <h2>Olá, <span id="userName">Dev</span> 👋</h2>
      <p>Continue evoluindo suas soft skills 🚀</p>

    </div>

    <!-- PROGRESSO -->
    <div class="dashboard-card">

      <h4>Nível 3</h4>

      <div class="progress mt-3">
        <div class="progress-bar" style="width: 60%"></div>
      </div>

      <p class="mt-2">120 XP / 200 XP</p>

    </div>

    <!-- CARDS -->
    <div class="row mt-4 g-4">

      <div class="col-md-4">
        <div class="dashboard-box">
          <h5>🎯 Desafios</h5>
          <p>Complete missões para evoluir.</p>
          <button class="btn btn-primary">Acessar</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dashboard-box">
          <h5>📊 Progresso</h5>
          <p>Veja sua evolução detalhada.</p>
          <button class="btn btn-primary">Ver</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dashboard-box">
          <h5>👤 Perfil</h5>
          <p>Gerencie suas informações.</p>
          <button class="btn btn-primary">Editar</button>
        </div>
      </div>

    </div>

  </div>

</section>

</body>
</html>
