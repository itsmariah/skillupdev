  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</head>

<body>

<div id="code-particles"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center" href="../index.html">
      <img src="../assets/SkillUpDevLogoSemNome.png" height="35" class="me-2">
      <span>SkillUp Dev</span>
    </a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link" href="../index.html">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Sobre</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../support.html">Suporte</a>
        </li>
      </ul>
    </div>

  </div>
</nav>

<!-- REGISTER -->
<section class="auth-section d-flex align-items-center justify-content-center">

  <div class="auth-container">

    <div class="auth-card">

      <h2>Criar conta</h2>
      <p class="auth-subtitle">Comece sua jornada nas soft skills 🚀</p>

      <form id="registerForm">

        <!-- NOME -->
        <div class="mb-3 text-start">
          <label>Nome</label>

          <div class="input-wrapper">
            <input type="text"
                   id="nome"
                   class="form-control input-with-icon-right"
                   placeholder="Seu nome completo"
                   required>

            <img src="../assets/icons/person-fill.svg" class="input-icon-right">
          </div>
        </div>

        <!-- NICK -->
        <div class="mb-3 text-start">
          <label>Nick</label>

          <div class="input-wrapper">
            <input type="text"
                   id="usuario"
                   class="form-control input-with-icon-right"
                   placeholder="Escolha seu nickname"
                   required>

            <img src="../assets/icons/controller.svg" class="input-icon-right">
          </div>
        </div>

        <!-- EMAIL -->
        <div class="mb-3 text-start">
          <label>Email</label>

          <div class="input-wrapper">
            <input type="email"
                   id="email"
                   class="form-control input-with-icon-right"
                   placeholder="Digite seu email"
                   required>

            <img src="../assets/icons/envelope.svg" class="input-icon-right">
          </div>
        </div>

        <!-- SENHA -->
        <div class="mb-3 text-start">
          <label>Senha</label>

          <div class="input-wrapper">
            <input type="password"
                   id="senha"
                   class="form-control input-with-icon-right"
                   placeholder="Crie uma senha"
                   required minlength="6">

            <img src="../assets/icons/eye-slash.svg"
                 id="toggleSenhaIcon"
                 class="input-icon-right"
                 onclick="toggleSenha()">
          </div>
        </div>

        <!-- CONFIRMAR SENHA -->
        <div class="mb-3 text-start">
          <label>Confirmar senha</label>

          <div class="input-wrapper">
            <input type="password"
                   id="confirmarSenha"
                   class="form-control input-with-icon-right"
                   placeholder="Confirme sua senha"
                   required>

            <img src="../assets/icons/eye-slash.svg"
                    id="toggleConfirmarSenhaIcon"
                    class="input-icon-right"
                    onclick="toggleConfirmarSenha()">
          </div>
        </div>

        <button id="registerBtn" class="btn btn-primary w-100 mt-3">
          Criar conta
        </button>

      </form>

      <p class="mt-3">
        Já tem conta?
        <a href="login.html">Entrar</a>
      </p>

    </div>

  </div>

</section>

<!-- FOOTER -->
 <footer>
    <div class="container text-center">
        <p>© 2026 SkillUp Dev - Todos os direitos reservados</p>
    </div>
 </footer>

</body>
</html>
