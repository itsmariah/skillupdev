<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <title>Cadastro - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body data-page="register">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="code-particles" aria-hidden="true"></div>

  <nav class="navbar fixed-top navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../assets/images/SkillUpDevLogoSemNome.webp" width="52" height="35" class="me-2" alt="">
        <span>SkillUp Dev</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRegister" aria-controls="navbarRegister" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarRegister">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">Sobre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="support.html">Suporte</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="conteudo" tabindex="-1">

  <section class="auth-section d-flex align-items-center justify-content-center">
    <div class="auth-container">
      <div class="auth-card text-center">
        <img src="../assets/images/SkillUpDevLogoSemNome.webp" width="90" height="60" class="mb-3" alt="Logo SkillUp Dev">

        <h1 class="h2">Criar conta</h1>
        <p class="auth-subtitle">Comece sua jornada nas soft skills com nível, badges e avatar.</p>

        <div id="registerFeedback" class="alert d-none" role="alert"></div>

        <form id="registerForm">
          <div class="mb-3 text-start">
            <label for="nome">Nome</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="nome"
                autocomplete="name"
                class="form-control input-with-icon-right"
                placeholder="Seu nome completo"
                required
              >

              <img src="../assets/icons/person-fill.svg" class="input-icon-right" alt="">
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="email">Email</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                autocomplete="email"
                class="form-control input-with-icon-right"
                placeholder="Digite seu email"
                required
              >

              <img src="../assets/icons/envelope.svg" class="input-icon-right" alt="">
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                autocomplete="new-password"
                class="form-control input-with-icon-right"
                placeholder="Crie uma senha"
                required
                minlength="6"
              >

              <button type="button" id="toggleSenhaIcon" class="input-icon-right password-toggle"
                aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                <img src="../assets/icons/eye-slash.svg" alt="">
              </button>
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="confirmarSenha">Confirmar senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="confirmarSenha"
                autocomplete="new-password"
                class="form-control input-with-icon-right"
                placeholder="Confirme sua senha"
                required
              >

              <button type="button" id="toggleConfirmarSenhaIcon" class="input-icon-right password-toggle"
                aria-label="Mostrar senha" aria-pressed="false" aria-controls="confirmarSenha">
                <img src="../assets/icons/eye-slash.svg" alt="">
              </button>
            </div>
          </div>

          <button id="registerBtn" class="btn btn-primary w-100 mt-3" type="submit">
            Criar conta
          </button>
        </form>

        <p class="mt-3">
          Já tem conta?
          <a href="login.html">Entrar</a>
        </p>

        <p>
          <a href="../index.html" class="text-decoration-none">
            Voltar para o início
          </a>
        </p>
      </div>
    </div>
  </section>

  </main>

  <footer>
    <div class="container text-center">
      <p>© 2026 SkillUp Dev - Todos os direitos reservados</p>
    </div>
  </footer>
</body>
</html>
