<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body data-page="register">
  <div id="code-particles"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../assets/SkillUpDevLogoSemNome.png" height="35" class="me-2" alt="Logo SkillUp Dev">
        <span>SkillUp Dev</span>
      </a>

      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">Sobre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="support.html">Suporte</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="auth-section d-flex align-items-center justify-content-center">
    <div class="auth-container">
      <div class="auth-card text-center">
        <img src="../assets/SkillUpDevLogoSemNome.png" height="60" class="mb-3" alt="Logo SkillUp Dev">

        <h2>Criar conta</h2>
        <p class="auth-subtitle">Comece sua jornada nas soft skills.</p>

        <div id="registerFeedback" class="alert d-none" role="alert"></div>

        <form id="registerForm">
          <div class="mb-3 text-start">
            <label for="nome">Nome</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="nome"
                class="form-control input-with-icon-right"
                placeholder="Seu nome completo"
                required
              >

              <img src="../assets/icons/person-fill.svg" class="input-icon-right" alt="">
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="usuario">Nick</label>

            <div class="input-wrapper">
              <input
                type="text"
                id="usuario"
                class="form-control input-with-icon-right"
                placeholder="Escolha seu nickname"
                required
              >

              <img src="../assets/icons/controller.svg" class="input-icon-right" alt="">
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="email">Email</label>

            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                class="form-control input-with-icon-right"
                placeholder="Digite seu email"
                required
              >

              <img src="../assets/icons/envelope.svg" class="input-icon-right" alt="">
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="senha">Senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="senha"
                class="form-control input-with-icon-right"
                placeholder="Crie uma senha"
                required
                minlength="6"
              >

              <img
                src="../assets/icons/eye-slash.svg"
                id="toggleSenhaIcon"
                class="input-icon-right"
                onclick="toggleSenha()"
                alt=""
              >
            </div>
          </div>

          <div class="mb-3 text-start">
            <label for="confirmarSenha">Confirmar senha</label>

            <div class="input-wrapper">
              <input
                type="password"
                id="confirmarSenha"
                class="form-control input-with-icon-right"
                placeholder="Confirme sua senha"
                required
              >

              <img
                src="../assets/icons/eye-slash.svg"
                id="toggleConfirmarSenhaIcon"
                class="input-icon-right"
                onclick="toggleConfirmarSenha()"
                alt=""
              >
            </div>
          </div>

          <button id="registerBtn" class="btn btn-primary w-100 mt-3" type="submit">
            Criar conta
          </button>
        </form>

        <p class="mt-3">
          Ja tem conta?
          <a href="login.html">Entrar</a>
        </p>

        <p>
          <a href="../index.html" class="text-decoration-none">
            Voltar para o inicio
          </a>
        </p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container text-center">
      <p>© 2026 SkillUp Dev - Todos os direitos reservados</p>
    </div>
  </footer>
</body>
</html>
