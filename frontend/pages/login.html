<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Login - SkillUp Dev</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</head>

<body>

<div id="code-particles"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="../assets/SkillUpDevLogoSemNome.png" height="35" class="me-2">
      <span>SkillUp Dev</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto align-items-center">

        <li class="nav-item">
          <a class="nav-link" href="frontend/index.html">Início</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Sobre</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="register.html">Suporte</a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<section class="auth-section d-flex align-items-center justify-content-center">

  <div class="auth-container">

    <div class="auth-card">

      <h2>Entrar na plataforma</h2>
      <p class="auth-subtitle">Acesse sua conta e continue evoluindo 🚀</p>

      <form>

        <!-- EMAIL -->
        <div class="mb-3 text-start position-relative">
          <label>Email</label>

          <input type="email"
                 class="form-control input-with-icon"
                 placeholder="Digite seu email">

          <img src="../assets/icons/envelope.svg" class="input-icon-right">
        </div>

        <!-- SENHA -->
        <div class="mb-3 text-start position-relative">
          <label>Senha</label>

          <input type="password"
                 id="senha"
                 class="form-control pe-5"
                 placeholder="Digite sua senha">

          <img src="../assets/icons/eye-slash.svg"
                id="toggleSenhaIcon"
                class="input-icon-right"
                onclick="toggleSenha()">
        </div>

        <button class="btn btn-primary w-100 mt-3">
          Entrar
        </button>

      </form>

      <p class="mt-3">
        Não tem conta?
        <a href="register.html">Cadastre-se</a>
      </p>

    </div>

  </div>

</section>
</section>

</body>
</html>
